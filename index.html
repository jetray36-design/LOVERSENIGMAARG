<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Congratulations</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background-color: #fff; /* White background */
            color: #000; /* Default text color */
            font-family: "VCR", monospace;
            text-align: center;
        }

        img {
            max-width: 300px;
            width: 50%;
            height: auto;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 36px;
            letter-spacing: 2px;
            color: transparent; /* Make text itself transparent */
            -webkit-text-stroke: 2px #000; /* Black outline */
            text-stroke: 2px #000; /* For other browsers */
        }
    </style>
</head>
<body>

    <img src="done.gif" alt="Done">
    <h1>Congratulations</h1>

</body>
</html>
