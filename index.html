<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Locked Page</title>

    <!-- VCR OSD Mono font -->
    <link href="https://fonts.cdnfonts.com/css/vcr-osd-mono" rel="stylesheet">

    <style>
        body {
            background: black;
            color: white;
            font-family: 'VCR OSD Mono', monospace;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        #content {
            margin-top: 30px;
            width: 70%;
        }

        input {
            padding: 8px 10px;
            font-family: inherit;
            background: #111;
            color: white;
            border: 1px solid white;
        }

        button {
            padding: 8px 15px;
            margin-left: 10px;
            font-family: inherit;
            background: #222;
            color: white;
            border: 1px solid white;
            cursor: pointer;
        }

        button:hover {
            background: #333;
        }
    </style>
</head>

<body>

<h2>Enter Password</h2>

<div>
    <input type="password" id="pwd">
    <button onclick="loadContent()">Unlock</button>
</div>

<div id="content" style="display:none;"></div>

<script src="decrypt.js"></script>

</body>
</html>
