<!DOCTYPE html>
<html>
<head>
<style>
body {
   margin: 0;
  background: url("BG.png") no-repeat center center fixed;
  background-size: cover;
}

.grid {
  display: grid;
  grid-template-columns: repeat(20, 1fr);
  grid-template-rows: repeat(10, 1fr);
  width: 100vw;
  height: 100vh;
}

.circle {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: white;
  margin: auto;
  transition: transform 0.1s ease, background 0.2s ease;
}

.circle:active {
  transform: scale(0.75);
}

.clicked {
  background: red !important;
}
</style>
</head>
<body>
<div class="grid">
<script>
for (let y = 1; y <= 10; y++) {
  for (let x = 1; x <= 20; x++) {
    if (x === 18 && y === 9) {
      document.write(`<a href="fffff" class="circle" onclick="this.classList.add('clicked')"></a>`);
    } else {
      document.write(`<div class="circle" onclick="this.classList.add('clicked')"></div>`);
    }
  }
}
</script>
</div>
</body>
</html>
