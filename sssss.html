<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Congratulations</title>

    <style>
        /* Hide everything until JS approves */
        body {
            display: none; /* Hidden until JS confirms access */
            margin: 0;
            height: 100vh;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background: url('BG.png') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            font-family: "VCR", monospace;
            text-align: center;
        }

        img {
            max-width: 300px;
            width: 50%;
            height: auto;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 36px;
            letter-spacing: 2px;
            color: transparent;
            -webkit-text-stroke: 2px #fff; /* White outline */
            text-stroke: 2px #fff;
        }

        .secret-link {
            color: #FF6767;
            font-size: 20px;
            margin-top: 10px;
            text-decoration: none;
        }

        .discord-btn {
            margin-top: 25px;
            padding: 12px 28px;
            font-size: 20px;
            font-family: "VCR";
            background: rgba(0,0,0,0.7);
            color: #FF6767;
            border: 2px solid #FF6767;
            cursor: pointer;
            text-transform: uppercase;
        }

        .discord-btn:hover {
            background: #FF6767;
            color: #000;
        }

    </style>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const allowed = sessionStorage.getItem("arg_access_granted");

            if (!allowed) {
                document.body.style.display = "flex";
                document.body.innerHTML = `
                    <h1 style="
                        color:red;
                        font-size:32px;
                        -webkit-text-stroke: 0;
                        text-stroke: 0;
                    ">ACCESS DENIED</h1>
                    <p style="color:white;">You are not allowed to view this page.</p>
                `;
            } else {
                document.body.style.display = "flex";
            }
        });
    </script>
</head>

<body>
    
    <h1>Congratulations</h1>



    <!-- Discord Redirect Button -->
    <button class="discord-btn" onclick="window.location.href='https://discord.gg/V8v4pkDh'">
        Click here to join the Trials
    </button>

</body>
</html>
