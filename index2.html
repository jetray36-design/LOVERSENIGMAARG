<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Congratulations</title>

    <style>
        /* Hide everything until JS approves */
        body {
            display: none;
            margin: 0;
            height: 100vh;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background-color: #fff;
            color: #000;
            font-family: "VCR", monospace;
            text-align: center;
        }

        img {
            max-width: 300px;
            width: 50%;
            height: auto;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 36px;
            letter-spacing: 2px;
            color: transparent;
            -webkit-text-stroke: 2px #000;
            text-stroke: 2px #000;
        }
    </style>

    <script>
        // Run immediately
        document.addEventListener("DOMContentLoaded", function () {
            const allowed = sessionStorage.getItem("arg_access_granted");

            if (!allowed) {
                // Replace entire page BEFORE showing anything
                document.body.style.display = "flex";
                document.body.innerHTML = `
                    <h1 style="color:red; font-size:32px;">ACCESS DENIED</h1>
                    <p>You are not allowed to view this page.</p>
                `;
            } else {
                // Allow page to render normally
                document.body.style.display = "flex";
            }
        });
    </script>
</head>

<body>
    <img src="done.gif" alt="Done">
    <h1>Congratulations</h1>
</body>

</html>
