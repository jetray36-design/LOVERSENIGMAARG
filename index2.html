<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Congratulations</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background-color: #fff;
            color: #000;
            font-family: "VCR", monospace;
            text-align: center;
        }

        img {
            max-width: 300px;
            width: 50%;
            height: auto;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 36px;
            letter-spacing: 2px;
            color: transparent;
            -webkit-text-stroke: 2px #000;
            text-stroke: 2px #000;
        }
    </style>
</head>
<body>

<script>
(function(){

    // --- Protection Layer 1: URL Key Check ---
    const params = new URLSearchParams(window.location.search);
    const key = params.get("k");

    // --- Protection Layer 2: Session Storage Check ---
    const unlocked = sessionStorage.getItem("p1");

    // If either is missing → deny access
    if (key !== "ok" || unlocked !== "true") {
        document.body.innerHTML = "<h1>ACCESS DENIED</h1>";

        // Optional: redirect back after 1.5 seconds
        setTimeout(() => {
            window.location.href = "index.html";
        }, 1500);

        return; // stop page load
    }

})();
</script>

    <img src="done.gif" alt="Done">
    <h1>Congratulations</h1>

<script>
// mark puzzle 2 as reached (optional for future puzzles)
sessionStorage.setItem("p2", "true");
</script>

</body>
</html>
