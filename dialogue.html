<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dialogue</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
<script src="encrypted-dialogue.js"></script>
<style>
body{font-family:Arial;background:#111;color:#fff;padding:20px;}
</style>
</head>
<body>

<h2>Decrypted Dialogue</h2>
<pre id="dialogue">Decrypting…</pre>

<script>
// check login
if(sessionStorage.getItem("validated") !== "true"){
    window.location.href = "gate.html";
}

// decrypt using AES-256
try {
    const bytes = CryptoJS.AES.decrypt(encryptedDialogue, "999193");
    const text = bytes.toString(CryptoJS.enc.Utf8);

    if(!text){
        document.getElementById("dialogue").innerText = "Decryption failed.";
    } else {
        document.getElementById("dialogue").innerText = text;
    }

} catch(e){
    document.getElementById("dialogue").innerText = "Error loading encrypted content.";
}
</script>

</body>
</html>
