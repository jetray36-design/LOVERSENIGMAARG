<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Encrypted File</title>
<style>
    body {
        background: black;
        color: white;
        font-family: Arial, sans-serif;
        padding: 40px;
        font-size: 25px;
        display: none;
    }
    #warning {
        position: fixed;
        inset: 0;
        background: black;
        color: red;
        font-size: 40px;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
    }
</style>

<script>
// AES-GCM decrypt
async function decryptText(password, encryptedBase64) {
    try {
        const pwUtf8 = new TextEncoder().encode(password);
        const pwHash = await crypto.subtle.digest('SHA-256', pwUtf8);

        const encryptedArray = Uint8Array.from(atob(encryptedBase64), c => c.charCodeAt(0));

        const iv = encryptedArray.slice(0, 12);
        const data = encryptedArray.slice(12);

        const key = await crypto.subtle.importKey(
            "raw",
            pwHash,
            "AES-GCM",
            false,
            ["decrypt"]
        );

        const decrypted = await crypto.subtle.decrypt(
            { name: "AES-GCM", iv },
            key,
            data
        );

        return new TextDecoder().decode(decrypted);

    } catch {
        return null;
    }
}

document.addEventListener("DOMContentLoaded", async () => {
    const stored = sessionStorage.getItem("verified");
    if (!stored) {
        window.location.href = "gate.html";
        return;
    }

    const password = "999193";

    // Encrypted content (AES-GCM + base64)
    const encryptedText =
"AAATgDEo3oX8DbsR1o0Vx9S8F2rR7OjPex0FuTiZMldBv52AqkSiwsXHK9FeI0sSADa5USGDWimEH5uM8AK8XX9F0zFqJGslXJYnFtzG0i+JCuT8q26QnwI2eQ5i8qXbyzRr";

    const decrypted = await decryptText(password, encryptedText);

    if (decrypted) {
        document.getElementById("content").innerHTML = decrypted;
        document.body.style.display = "block";
        document.getElementById("warning").style.display = "none";
    } else {
        window.location.href = "gate.html";
    }
});
</script>

</head>
<body>

<div id="warning">ENCRYPTED FILE — ACCESS DENIED</div>

<div id="content"></div>

</body>
</html>
