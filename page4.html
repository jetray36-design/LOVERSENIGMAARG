<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>The Bell</title>

<style>

body {
    height: 100vh;
    margin: 0;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    background-color: black;
    color: white;

    font-family: "Times New Roman", serif;
}

/* Ritual text */
h2 {
    margin-bottom: 25px;
    letter-spacing: 1px;
    text-align: center;
}

/* Counter text */
#counter {
    margin-bottom: 30px;
    font-size: 18px;
    color: gray;
    letter-spacing: 2px;
}

/* Cursed button */
button {

    font-size: 26px;
    padding: 15px 40px;

    background-color: black;
    color: red;

    border: 2px solid white;
    border-radius: 6px;

    letter-spacing: 3px;
    text-transform: uppercase;

    box-shadow: 0 0 10px red;

    cursor: pointer;

    transition: 0.25s;
}

button:hover {

    background-color: red;
    color: black;

    box-shadow: 0 0 25px red;

}

button:active {

    transform: scale(0.95);

}

/* Hidden video */

video {

    margin-top: 30px;
    display: none;

}

</style>
</head>


<body>

<h2>
Ring thou the bell threescore and six times,<br>
and that which is hidden shall be made manifest.
</h2>

<div id="counter">
Bell hath tolled: 0
</div>

<button id="bellButton" onclick="ringBell()">
RING THE BELL
</button>

<audio id="bellSound" src="bell.mp3"></audio>

<video id="secretVideo" width="720" controls>
    <source src="secret.mp4" type="video/mp4">
</video>


<script>

let count = 0;

function ringBell() {

    count++;

    // play bell sound each click
    let bell = document.getElementById("bellSound");
    bell.currentTime = 0;
    bell.play();

    // update counter text
    document.getElementById("counter").innerText =
        "Bell hath tolled: " + count;

    // omen escalation near completion
    if (count >= 60) {
        document.getElementById("counter").style.color = "red";
    }

    // reveal secret at 67 presses
    if (count >= 67) {

        document.getElementById("secretVideo").style.display = "block";
        document.getElementById("secretVideo").play();

        document.getElementById("bellButton").style.display = "none";

        document.getElementById("counter").innerText =
            "It hath been revealed. SIX SEVENNNNN SIX SEVENNNNN ⁶🤷‍♂️⁷ 6🫲🤪 🫱7 ";

    }

}

</script>

</body>
</html>
