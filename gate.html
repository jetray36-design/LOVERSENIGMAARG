<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Access Gate</title>
<style>
    body {
        background: black;
        color: white;
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        gap: 20px;
    }
    input {
        padding: 10px;
        font-size: 20px;
        width: 200px;
        text-align: center;
    }
    button {
        padding: 10px 20px;
        font-size: 20px;
        cursor: pointer;
    }
</style>

<script>
function verifyPass() {
    const pw = document.getElementById("pass").value;

    if (pw === "999193") {
        sessionStorage.setItem("verified", "allowed");
        window.location.href = "dialogue.html";
    } else {
        alert("Incorrect password");
    }
}
</script>
</head>

<body>

<h1>ENTER PASSWORD</h1>
<input id="pass" type="password" placeholder="******">
<button onclick="verifyPass()">ENTER</button>

</body>
</html>
