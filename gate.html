<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Access Gate</title>
<style>
    body {
        background: black;
        color: white;
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        gap: 20px;
    }
    input {
        padding: 10px;
        font-size: 20px;
        width: 200px;
        text-align: center;
    }
    button {
        padding: 10px 20px;
        font-size: 20px;
        cursor: pointer;
    }
</style>
<script>
async function sha256(message) {
    const msgBuffer = new TextEncoder().encode(message);
    const hashBuffer = await crypto.subtle.digest("SHA-256", msgBuffer);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

async function verifyPass() {
    const input = document.getElementById("pass").value;
    const hash = await sha256(input);

    // Correct SHA-256 of the password string "999193"
    const correctHash = "836f25291b73aa0bc87db1e629cd1ac3a862bfc35d28969351d01fb1eecce5e8";

    if (hash === correctHash) {
        sessionStorage.setItem("verified", hash);
        window.location.href = "dialogue.html";
    } else {
        alert("Incorrect password");
    }
}
</script>
</head>
<body>

<h1>ENTER PASSWORD</h1>
<input id="pass" type="password" placeholder="******">
<button onclick="verifyPass()">ENTER</button>

</body>
</html>
