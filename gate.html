<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Encrypted File</title>
<style>
body{font-family:Arial;background:#111;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;}
input{padding:10px;border:none;border-radius:5px;margin-top:10px;}
button{padding:10px 20px;margin-top:10px;cursor:pointer;border:none;border-radius:5px;}
#error{color:red;margin-top:10px;display:none;}
</style>
</head>
<body>

<h2>Encrypted File</h2>
<input id="pw" type="password" placeholder="Enter Passcode">
<button onclick="check()">Unlock</button>
<div id="error">Incorrect password.</div>

<script>
function check(){
    const p = document.getElementById("pw").value.trim();
    if(p === "999193"){
        sessionStorage.setItem("validated", "true");
        window.location.href = "dialogue.html";
    } else {
        document.getElementById("error").style.display="block";
    }
}
</script>

</body>
</html>
