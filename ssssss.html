<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Congratulations</title>

<style>
  @font-face {
    font-family: "VCR";
    src: url("VCR_OSD_MONO_1.001.ttf") format("truetype");
  }

  html,body{height:100%;margin:0}
  body {
    margin: 0;
    font-family: "VCR", monospace;
    background: url('BG.png') no-repeat center center fixed;
    background-size: cover;
    color: #fff;
    text-align: center;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
  }

  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.95);
    color: #ff6767;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:99999;
    flex-direction:column;
    font-size:28px;
    text-align:center;
    padding:28px;
  }

  #card {
    max-width:900px;
    width:90%;
    color:#fff;
  }

  .discord-btn {
      margin-top: 25px;
      padding: 12px 28px;
      font-size: 20px;
      font-family: "VCR";
      background: rgba(0,0,0,0.7);
      color: #FF6767;
      border: 2px solid #FF6767;
      cursor: pointer;
      text-transform: uppercase;
  }

  .discord-btn:hover {
      background: #FF6767;
      color: #000;
  }
</style>
</head>
<body>

<div id="overlay" role="alert" aria-live="assertive">
  <div>
    <div style="font-weight:700; font-size:36px; color:#ff6767; margin-bottom:8px;">ENCRYPTED FILE</div>
    <div style="color:#fff; margin-top:8px;">ACCESS DENIED — RETURN TO PASSWORD GATE</div>
    <div style="margin-top:18px;"><a href="gate.html" style="color:#ff6767; text-decoration:none; font-family:VCR;">Go to Gate</a></div>
  </div>
</div>

<div id="card" aria-hidden="true" style="display:none;">
  <!-- decrypted content will be injected here -->
  <div id="content"></div>
</div>

<script src="secure.js"></script>
<script>
(function(){
  // attempt decrypt
  var plain = attemptDecrypt();
  if(plain){
    // injection succesful
    document.getElementById('content').innerHTML = plain;
    document.getElementById('card').style.display = 'block';
    document.getElementById('card').removeAttribute('aria-hidden');
    // remove overlay
    var ov = document.getElementById('overlay');
    if(ov) ov.style.display = 'none';
  } else {
    // keep overlay visible
    // Optionally add a small listener so if the user came from gate.html in same tab the overlay auto-updates
    window.addEventListener('storage', function(e){
      if(e.key === 'z' || e.key === 'arg_flag'){
        // try again after a small delay
        setTimeout(function(){
          var p = attemptDecrypt();
          if(p){
            document.getElementById('content').innerHTML = p;
            document.getElementById('card').style.display = 'block';
            var ov2 = document.getElementById('overlay');
            if(ov2) ov2.style.display = 'none';
          }
        }, 120);
      }
    }, false);
  }
})();
</script>
</body>
</html>
