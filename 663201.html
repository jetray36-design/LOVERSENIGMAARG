<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>663201</title>
    <style>
      /* Reset and Force Fullscreen */
      html, body { 
        margin: 0; padding: 0; width: 100%; height: 100%; 
        overflow: hidden; background-color: #000; 
      }
      #unity-container { 
        width: 100%; height: 100%; 
      }
      #unity-canvas { 
        width: 100% !important; height: 100% !important; 
        display: block; 
      }
      /* Loading Bar styling */
      #unity-loading-bar { 
        position: absolute; left: 50%; top: 50%; 
        transform: translate(-50%, -50%); display: none; 
      }
      #unity-progress-bar-empty { 
        width: 200px; height: 20px; background: #333; border-radius: 10px; 
      }
      #unity-progress-bar-full { 
        width: 0%; height: 100%; background: #fff; border-radius: 10px; 
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      
      <div id="unity-loading-bar">
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
    </div>

    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/HTML 2.loader.js";
      var config = {
        dataUrl: buildUrl + "/HTML 2.data",
        frameworkUrl: buildUrl + "/HTML 2.framework.js",
        codeUrl: buildUrl + "/HTML 2.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "663201",
        productVersion: "1.0",
      };

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
